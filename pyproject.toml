    "massive>=2.8.0",
    "ollama>=0.6.2",
    "plotly>=6.8.0",
    "pydantic>=2.13.3",
    "pydantic-ai-slim[mcp,openai]>=1.107.0",
    "pypdf>=6.10.2",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.2",
